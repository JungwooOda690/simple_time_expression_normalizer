[project]
name = "simple-time-expression-normalizer"
version = "0.1.0"
description = "Turns short phrases like tomorrow at 17:30 into datetime objects."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
